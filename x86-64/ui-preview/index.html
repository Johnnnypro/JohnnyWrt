<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JohnnyWrt 页面回归预览</title><link rel="stylesheet" href="aurora.css"><style>body{padding:24px;background:var(--bg);color:var(--text)}#controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}#controls button,#controls select{padding:8px}#audit{font-size:12px;white-space:pre-wrap}.fixture-nav{display:flex;justify-content:space-between;margin:0 auto 24px;max-width:1280px}#app{margin:auto;display:block;width:100%;max-width:1280px}.jw-logo[src*="meowx"]{visibility:hidden}#app *{transition:none!important;animation:none!important}</style></head><body><div id="controls"><select id="page" aria-label="预览页面"><option value="home">首页</option><option value="zerotier">ZeroTier</option><option value="network">网络向导</option></select><button data-theme="device">跟随系统</button><button data-theme="light">浅色</button><button data-theme="dark">深色</button><button id="system-light">模拟系统浅色</button><button id="system-dark">模拟系统深色</button><button id="audit-button">检查对比度</button><span id="mode"></span></div><div class="fixture-nav"><strong>JohnnyWrt</strong><span>首页　网络向导　状态　系统　服务　网络</span></div><div id="app"></div><pre id="audit"></pre><script src="fixture.js"></script></body></html>
