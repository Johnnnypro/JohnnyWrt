name: Complete verified 26.11.10 candidate
on:
  workflow_dispatch:
concurrency:
  group: johnnywrt-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  complete:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: 26.11.10
      RELEASE_TAG: Johnnywrt-ISO-25.12.2-1794270621
    steps:
      - name: Check out the immutable firmware and test source
        uses: actions/checkout@v6
        with:
          ref: a73030258e07366d9dd59d4c22850a19ae2fbf1f

      - name: Verify completed upgrade and ISO evidence before preparing public files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = a73030258e07366d9dd59d4c22850a19ae2fbf1f
          gh api repos/Johnnnypro/JohnnyWrt/actions/runs/42732462638/jobs > final-jobs.json
          gh api repos/Johnnnypro/JohnnyWrt/actions/artifacts/13725902095/zip > verified.zip
          echo '017715d65e53a3d38bf7d0bdaedff7b5cab5839313697bab72edd8e497a06cf7  verified.zip' | sha256sum -c -
          unzip -q verified.zip -d verified
          python3 - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          job = next(j for j in json.loads(Path('final-jobs.json').read_text())['jobs'] if j['name'] == 'complete')
          steps = {s['name']: s['conclusion'] for s in job['steps']}
          for name in ['Require the exact original candidate and successful completed gates', 'Prove KVM access without a temporary user ACL', 'Verify required firmware packages', 'Verify retained-settings upgrades and real SSH login', 'Verify latest release to new and new to new upgrades', 'Verify ISO boot catalog and embedded firmware']:
              assert steps[name] == 'success', name
          original = json.loads(Path('verified/saved-run.json').read_text())
          assert original['head_sha'] == 'a73030258e07366d9dd59d4c22850a19ae2fbf1f'
          source = Path('x86-64/test-sysupgrade.py').read_bytes()
          assert hashlib.sha256(source).hexdigest() == 'a36eb7a25de8d08a1d003c06b40761cfa2a21bffe1486856643582bbafcc271f'
          function = next(n for n in ast.parse(source).body if isinstance(n, ast.FunctionDef) and n.name == 'assert_retained')
          namespace = {'hashlib': hashlib}
          exec(compile(ast.Module(body=[function], type_ignores=[]), 'retention', 'exec'), namespace)
          for directory in [Path('verified/bin/targets/x86/64'), Path('verified/latest-upgrade')]:
              baseline = json.loads((directory/'retention-baseline.json').read_text())
              snapshots = list(directory.glob('retention-round-*.json'))
              assert len(snapshots) == 4
              for snapshot in snapshots:
                  namespace['assert_retained'](baseline, json.loads(snapshot.read_text()))
          lines = Path('verified/bin/targets/x86/64/boot-test.log').read_bytes().decode('utf-8','replace').splitlines()
          for prefix, count in [('NETWORK_TEST_BEGIN ',5), ('NETWORK_DNS_PASS ',13), ('PASS: startup ',2), ('JOHNNY_BOOT_TEST_PASSED',1), ('JOHNNY_NAT_DIAGNOSTICS_END',1)]:
              assert sum(line.startswith(prefix) for line in lines) == count, prefix
          assert 'JOHNNY_BOOT_TEST_FAILED' not in lines
          print('PASS: exact original source, complete smoke and all eight upgrade snapshots')
          PY
          mkdir -p bin/targets/x86/64
          cp verified/bin/targets/x86/64/*squashfs-combined-efi.img.gz verified/bin/targets/x86/64/*.manifest bin/targets/x86/64/
          echo '1f3800a23349495d7ddaf20a031556e62ddc64186e24def8f679878abd90aab6  bin/targets/x86/64/immortalwrt-25.12.2-x86-64-generic-squashfs-combined-efi.img.gz' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools

      - name: Verify required firmware packages
        run: |
          manifest=$(find bin/targets/x86/64 -maxdepth 1 -name '*.manifest' -print -quit)
          test -n "$manifest"
          python3 x86-64/check-meowx-versions.py "$manifest"
          for package in procd procd-ujail procd-seccomp; do
            grep -Fx "$package - 2026.03.13~58eb263d-r2" "$manifest"
          done
          for package in meowx-core meowx luci-app-meowx luci-i18n-meowx-zh-cn tailscale zerotier luci-app-zerotier luci-theme-aurora luci-mod-rpc luci-lib-ipkg luci-compat libuci-lua ucode-mod-socket ip-full; do
            grep -E "^${package} - " "$manifest" || exit 1
          done
          if grep -E '^(luci-app-store|quickstart|luci-app-quickstart|luci-i18n-quickstart-[^ ]+) - ' "$manifest"; then exit 1; fi
          grep '^kernel - ' "$manifest"

      - name: Build ISO installer from verified firmware
        run: |
          git clone https://github.com/wukongdaily/img-installer.git
          git -C img-installer checkout 361ea6138094a2417e62edd01f73fa1160e93e01
          chmod +x img-installer/supportFiles/custom/build.sh
          image=$(find bin/targets/x86/64 -maxdepth 1 -name '*squashfs-combined-efi.img.gz' -print -quit)
          cp "$image" firmware-for-iso.img.gz
          cd img-installer
          bash autobuild/autobuild.sh ../firmware-for-iso.img.gz

      - name: Verify ISO boot catalog and embedded firmware
        env:
          VERSION: 25.12.2
          SIZE: 1G
        run: |
          echo '1f3800a23349495d7ddaf20a031556e62ddc64186e24def8f679878abd90aab6  bin/targets/x86/64/immortalwrt-25.12.2-x86-64-generic-squashfs-combined-efi.img.gz' | sha256sum -c -
          iso=img-installer/output/custom-installer-x86_64.iso
          test -s "$iso"
          xorriso -indev "$iso" -report_el_torito plain 2>&1 | tee iso-boot-catalog.txt
          grep 'BIOS' iso-boot-catalog.txt
          grep 'UEFI' iso-boot-catalog.txt
          xorriso -osirrox on -indev "$iso" -extract /live/filesystem.squashfs iso-filesystem.squashfs
          image=$(find bin/targets/x86/64 -maxdepth 1 -name '*squashfs-combined-efi.img.gz' -print -quit)
          expected=$(gzip -dc "$image" | sha256sum | cut -d ' ' -f1)
          actual=$(unsquashfs -cat iso-filesystem.squashfs mnt/custom.img | sha256sum | cut -d ' ' -f1)
          test "$expected" = "$actual"
          echo "PASS: ISO contains the exact boot-tested firmware ($actual)"
          cd img-installer/output
          mv custom-installer-x86_64.iso Johnnywrt-x86_64.iso
          cp "$GITHUB_WORKSPACE/$image" Johnnywrt-x86_64-squashfs-combined-efi.img.gz
          cp "$GITHUB_WORKSPACE"/bin/targets/x86/64/*.manifest .
          jq -n --arg tag "$RELEASE_TAG" --arg version "$VERSION" --arg display_version "$RELEASE_VERSION" --arg commit "a73030258e07366d9dd59d4c22850a19ae2fbf1f" --argjson rootfs_mb "$(( ${SIZE%G} * 1024 ))" \
            '{tag:$tag,version:$version,display_version:$display_version,commit:$commit,target:"x86/64",format:"squashfs-combined-efi",rootfs_mb:$rootfs_mb}' > firmware.json
          sha256sum Johnnywrt-x86_64.iso *squashfs-combined-efi.img.gz *.manifest firmware.json > SHA256SUMS

      - name: Prepare ISO release notes
        env:
          VERSION: 25.12.2
          INCLUDE_DOCKER: "no"
        run: |
          cat > "$GITHUB_WORKSPACE/router-info.md" <<EOF
          - 本发布复用原始构建 #17 的干净镜像；完整功能、四次保留配置升级及 ISO 校验均已通过。本任务重放留存证据并准备公开文件，未重新编译或修改固件。

          ## Johnnywrt $RELEASE_VERSION — 基于 ImmortalWrt $VERSION x86-64

          - 网页升级：选择 squashfs-combined-efi.img.gz 并保留配置，不要上传 ISO；保持与原设备相同的根分区大小。
          - 系统 → 备份与更新 → 更新固件 → 在线更新：固定检查本仓库，下载 SHA256 和系统校验通过后，确认保留配置升级。同系列、同分区布局才允许在线升级，不强制刷写。
          - UEFI 全新安装：使用下方 ISO 安装器，或解压 combined-efi.img.gz 后直接写入新磁盘；两种方式均使用 UEFI 启动（不含 Secure Boot 签名保证）。
          - 本版通过 Dropbear 原生 -z 修复 SSH 优先级标记兼容性，首次安装及保留配置升级均生效，不修改认证或绑定。
          - 构建使用当前 MeowX OpenWrt 签名源，插件与核心的实际版本见本发布 manifest；不混用桌面/Android 版本号。
          - 已通过一次性虚拟机中的旧版到新版、新版到新版保留配置升级和真实 SSH 登录检查。
          - 维护方法见 main 分支 AGENTS.md、MAINTENANCE.md；保留旧发布用于恢复。源码：a73030258e07366d9dd59d4c22850a19ae2fbf1f。


          - 虚拟机选择 UEFI 启动，挂载 ISO，并准备至少 8 GB 虚拟硬盘。
          - 启动后输入 ddd，选择目标虚拟硬盘安装；安装完成后卸载 ISO，从硬盘启动。安装会清空所选硬盘。
          - 默认通过主路由 DHCP 获取管理地址；请在主路由租约列表查找 JohnnyWrt。
          - 自身 DHCP 服务已关闭，物理网口加入 LAN；首次使用只连接一个网口到现有局域网。
          - 用户名 root，初始无密码；首次登录后请设置密码。
          - 内置 MeowX（含核心和中文界面）、ZeroTier、独立首页和主／旁路由网络向导；不安装 iStore 或旧 QuickStart 后台服务。
          - SSH 或本地控制台输入 quickstart，使用英文三项菜单：查看地址、设置管理 IPv4/掩码/网关/DNS、退出。掩码默认 255.255.255.0、DNS 默认 223.5.5.5，直接回车采用；DHCP 模式仍可在网页设置。保存前显示预览并确认；应用会中断连接，按提示使用新地址重连，本菜单确认后不自动回滚。
          - 在线更新来源为 Johnnnypro/JohnnyWrt；旧仓库的已安装固件需先手动上传本版并保留配置，以后从新仓库在线更新。
          - 首页移除 ZeroTier 卡片，左侧保留完整 MeowX，右侧排列网络流量与接口；ZeroTier 服务、身份、配置与菜单保留。
          - 内置 MeowX 组网需要的 Tailscale，避免保留配置升级后只有身份文件却缺少程序。最新 #14 安装当前组网依赖后，已验证两轮升级保留本机测试身份和原生服务；不代表真实主控授权或两地连接已经验证。
          - 稳定 procd 58eb263d 移植上游启动信号修复，三包版本为2026.03.13~58eb263d-r2，避免DNS隔离进程刚启动即被重载信号杀死；保留jail与IPv6。已验证精确启动时刻的HUP/停止请求、正常重载及原有五种网络模式应用/回滚后的实际本机DNS应答。
          - 对外版本采用日期编号；内部标签和 firmware.json.version 保持旧更新器兼容格式，底层仍为 ImmortalWrt $VERSION。固定升级文件名及 32/1024 MiB 分区布局不变。
          - 首页订阅栏改为紧凑自适应布局，普通名称保留适当宽度，长名称省略显示并可从下拉列表查看完整名称；更新订阅按钮缩小并显示文字。修正服务开关圆点越界，不新增 MeowX 更新红点或首页版本检查。
          - ZeroTier 保留旧配置；关闭“允许受管”时明确提示自动地址与路由未启用，不再误报自动配置就绪。切换该设置后，已有目标检测结果提示重新检测。
          - 网络向导恢复已发布旧版行为，不新增 IPv6 开关；IPv6 继续在原生高级网络设置中管理。真实运营商 DHCPv6/PD、PPPoE 协商需部署后验证。
          - 网络向导使用原生应用与回滚保护，主路由需要独立 WAN/LAN 网口；不会复制 QuickStart 的辅助网口。
          - 系统 → 主题设置保留已安装主题选择；Aurora、Argon、Bootstrap 均支持跟随系统、浅色和深色。首页、网络向导、ZeroTier 和主题页检查了桌面及 390px 手机布局和文字对比度。
          - 选中 Argon 后可打开详细设置对话框，设置主题颜色和登录背景；不再显示独立的 Argon 菜单。只读账户不能打开编辑对话框或调用背景文件修改接口。
          - 按用户要求移除自定义 CSS 功能和旧入口。旧样式不再加载；每次发布使用独立资源缓存标识，普通刷新即可获取新版页面。
          - ZeroTier 新增手动目标 IP 与 TCP 端口检测，连接超时 5 秒，核对路由经过所选 ZeroTier 网卡；显示上次结果和时间，不自动重复探测，不代表两端内网设备均可互访。
          - 内置 luci-mod-rpc、luci-lib-ipkg 和 luci-compat；LuCI RPC 随 Web 服务启动。系统使用 APK，旧 ipkg RPC 的软件包管理功能仍依赖 opkg，不能据此认定兼容 APK。
          - 默认主机名 JohnnyWrt，保留配置升级保留原有主机名；使用原始 Johnny Logo 标签页图标；底层版本信息保持 ImmortalWrt，避免软件源及内核包不匹配。
          - 软件源校正为 ImmortalWrt 官方源，保留版本号、架构和内核 ABI；构建中实际更新列表并安装匹配内核的测试模块。
          - 已预装 zashboard 3.29.1 完整面板及字体，无需首次打开时下载；导入订阅并启动 MeowX 后可打开面板。
          - 同时内置 GeoIP、GeoSite 和 ASN 数据并校验 SHA256；MeowX 两种地理数据模式已通过下载地址不可用时的配置测试。订阅本身和自定义远程规则仍需联网。
          - ZeroTier 网络 ID 留空。在 服务 → ZeroTier → 设置向导 填写网络 ID，自行打开授权面板授权；页面自动检查节点、授权和分配地址，支持第三方控制器。
          - ZeroTier 接口自动关联，允许与 LAN 双向转发；仅对 ZeroTier 进入本机直接连接的 IPv4 LAN 的流量做源地址转换，帮助局域网设备回包。防火墙重载及 LAN 改地址后自动刷新。
          - 两地均使用此旁路由时：客户端网关指向本地旁路由，ZeroTier 管理中心配置两地托管路由并授权节点。无需修改主路由，也无需给 NAS 添加回程路由；访问记录中看到的是本地旁路由地址。
          - 不内置个人网络 ID、节点密钥、站点 IP 或密码，不接管 ZeroTier 默认路由或 DNS。保留配置升级时仍保留原有 LAN 与 ZeroTier 设置。
          - Docker: $INCLUDE_DOCKER
          - 镜像已通过软件包清单、QEMU UEFI 功能、真实 SSH 认证及旧到新/新到新保留配置升级检查；实机网卡、私人订阅和两地联通性需部署后验证。发布固件不等于已升级用户设备。
          EOF

      - name: Save all verified public files for account-authorized publication
        uses: actions/upload-artifact@v4
        with:
          name: release-files-26.11.10
          path: |
            img-installer/output/Johnnywrt-x86_64.iso
            img-installer/output/*squashfs-combined-efi.img.gz
            img-installer/output/*.manifest
            img-installer/output/firmware.json
            img-installer/output/SHA256SUMS
            router-info.md
            iso-boot-catalog.txt
          if-no-files-found: error
          retention-days: 7
