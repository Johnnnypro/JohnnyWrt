name: Verify saved firmware before account migration build
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare_saved_firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      # GitHub requires push access to read unpublished draft assets.
      # This isolated job runs only GET, SHA256 verification and artifact upload.
      contents: write
    steps:
      - name: Read and verify the unpublished diagnostic asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir diagnostic
          gh api -H 'Accept: application/octet-stream' repos/Johnnnypro/JohnnyWrt/releases/assets/685304418 > diagnostic/firmware.img.gz
          echo '681c68282da0c1c2b6cfcba67f421c3243982dfb9008bd7f58156002a5c6ac0e  diagnostic/firmware.img.gz' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: migration-input-${{ github.run_id }}
          path: diagnostic/firmware.img.gz
          if-no-files-found: error
          retention-days: 1

  verify_saved_firmware:
    needs: prepare_saved_firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - name: Check out the source that produced the saved firmware
        uses: actions/checkout@v6
        with:
          repository: Johnnnnnnnyx/JohnnyWrt
          ref: aea524e7d88fe12320b4a9c0b5054fcfd45eb7dd
          path: saved-source
          persist-credentials: false
      - name: Apply only the verified serial-input test fixes
        run: |
          cp x86-64/smoke-test25.py x86-64/network-test-plans.js x86-64/test-smoke-input.py saved-source/x86-64/
          python3 saved-source/x86-64/test-smoke-input.py
          python3 saved-source/x86-64/test-upgrade-readiness.py
          python3 saved-source/x86-64/test-retention-evidence.py
          node --test x86-64/test-update-ui.js x86-64/test-johnny-model.js x86-64/test-johnny-ui.js
      - name: Read the verified input with read-only permissions
        uses: actions/download-artifact@v4
        with:
          name: migration-input-${{ github.run_id }}
          path: diagnostic
      - name: Verify the input and download the previous release baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir previous-release
          echo '681c68282da0c1c2b6cfcba67f421c3243982dfb9008bd7f58156002a5c6ac0e  diagnostic/firmware.img.gz' | sha256sum -c -
          gh release download Johnnywrt-ISO-25.12.2-1793177592 --repo Johnnnnnnnyx/ImmortalWrt-ImageBuilder --pattern Johnnywrt-x86_64-squashfs-combined-efi.img.gz --dir previous-release
          echo 'aaf4f7cc25d026f5e24d38affdfcf589c6f1f50ac8883c88ffd48edef9df1956  previous-release/Johnnywrt-x86_64-squashfs-combined-efi.img.gz' | sha256sum -c -
          gzip -dc previous-release/Johnnywrt-x86_64-squashfs-combined-efi.img.gz > previous-release/base.img
      - name: Install the normal CI test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso squashfs-tools
          python3 -m pip install paramiko==3.5.1
      - name: Verify full UEFI boot and functions with the CI serial transport
        run: python3 saved-source/x86-64/smoke-test25.py diagnostic/firmware.img.gz
      - name: Verify old-to-new and new-to-new retained-settings upgrades
        run: |
          python3 saved-source/x86-64/test-sysupgrade.py previous-release/base.img diagnostic/firmware.img.gz
          echo '681c68282da0c1c2b6cfcba67f421c3243982dfb9008bd7f58156002a5c6ac0e  diagnostic/firmware.img.gz' | sha256sum -c -
      - name: Save verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-verification-${{ github.run_number }}
          path: |
            diagnostic/boot-test.log
            diagnostic/retention-*.json
            diagnostic/upgrade-test.log
            diagnostic/upgrade-test-screen.ppm
          retention-days: 7
